# Configuration of detekt rule sets, see https://detekt.dev/docs/intro.
# This file only lists the differences to the default configuration at
# https://github.com/detekt/detekt/blob/main/detekt-core/src/main/resources/default-detekt-config.yml.

comments:
  AbsentOrWrongFileLicense:
    active: true
    excludes: ['**/build/generated/**']
    licenseTemplate: |
      ^\/\*
       \* (C)opyright \(C\) 20[0-9][0-9] The ORT Server Authors \(See \<https:\/\/github\.com\/eclipse-apoapsis\/ort-server\/blob\/main\/NOTICE\>\)
       \*
       \* Licensed under the Apache License, Version 2\.0 \(the "License"\);
       \* you may not use this file except in compliance with the License\.
       \* You may obtain a copy of the License at
       \*
       \*     https:\/\/www\.apache\.org\/licenses\/LICENSE-2\.0
       \*
       \* Unless required by applicable law or agreed to in writing, software
       \* distributed under the License is distributed on an "AS IS" BASIS,
       \* WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied\.
       \* See the License for the specific language governing permissions and
       \* limitations under the License\.
       \*
       \* SPDX-License-Identifier(:) Apache-2\.0
       \* License-Filename: LICENSE
       \*\/$
    licenseTemplateIsRegex: true

complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 33
  LongMethod:
    allowedLines: 158
  LongParameterList:
    allowedConstructorParameters: 11
    allowedFunctionParameters: 11
  NestedBlockDepth:
    allowedDepth: 10
  TooManyFunctions:
    allowedFunctionsPerClass: 19
    allowedFunctionsPerObject: 14

coroutines:
  InjectDispatcher:
    active: false

# Formatting rules are implemented via the ktlint plugin. As ktlint does not allow exceptions, we need to disable
# respective rules completely.
ktlint:
  AnnotationOnSeparateLine:
    active: false
  ArgumentListWrapping:
    active: false
  ChainMethodContinuation:
    active: false
  ChainWrapping:
    active: false
  ClassSignature:
    active: false
  CommentWrapping:
    active: false
  FinalNewline:
    active: false
  FunctionSignature:
    active: false
  ImportOrdering:
    active: false
  Indentation:
    active: false
  MaximumLineLength:
    active: false
  NoBlankLineInList:
    active: false
  NoWildcardImports:
    active: false
  ParameterListWrapping:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  StringTemplateIndent:
    active: false
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: false
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: false

naming:
  InvalidPackageDeclaration:
    active: false

performance:
  SpreadOperator:
    active: false

style:
  ForbiddenComment:
    active: false
  ForbiddenMethodCall:
    active: true
    methods:
      # Use org.eclipse.apoapsis.ortserver.utils.logging.runBlocking to make sure the MDC context is preserved.
      - 'kotlinx.coroutines.runBlocking'
      # Use the helpers from org.eclipse.apoapsis.ortserver.dao instead.
      - 'org.jetbrains.exposed.v1.jdbc.transactions.suspendTransaction'
      - 'org.jetbrains.exposed.v1.jdbc.transactions.transaction'
    excludes:
      - '**/cli/**' # The CLI does not have access to the utils package that contains the alternative runBlocking.
      - '**/src/test/**'
      - '**/src/testFixtures/**'
      - '**/src/*Test/**'
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  SpacingAfterPackageAndImports:
    active: true
  ThrowsCount:
    max: 5
  WildcardImport:
    excludeImports:
      - org.eclipse.apoapsis.ortserver.core.plugins.*

ORT:
  OrtImportOrder:
    active: true
  OrtPackageNaming:
    # TODO: Implement package naming check for ort-server.
    active: false
